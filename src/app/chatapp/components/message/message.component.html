<div class="rounded-2xl rounded-br-none">
    <div class="dark:bg-[#111a29] text-white p-4 rounded-2xl max-w-[75%] break-words"
        [class.rounded-br-none]="isMyMessage() && !isCompoundMessage()"
        [class.rounded-bl-none]="!isMyMessage() && !isCompoundMessage()"
        [class.float-right]="isMyMessage()"
        [class.float-left]="!isMyMessage()">
        {{ message() }}
    </div>
</div>

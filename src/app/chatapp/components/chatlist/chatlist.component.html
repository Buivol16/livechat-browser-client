<div class="flex flex-col gap-4 h-full overflow-y-auto w-full md:w-64">
    
    <!-- public chatlist -->
    <div>
        <h2 class="dark:text-gray-500 text-lg font-semibold">Public</h2>
        <ul>
            @for (chat of publicChats; track $index) {
                <li class="cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 p-2 flex gap-4 rounded transition-all ease-in-out duration-200">
                    <span class="inline-block w-3 h-3 rounded-full border-2 border-gray-500 self-center"></span>
                    {{ chat.name }}
                </li>
            }
        </ul>
    </div>

    <!-- private chatlist -->
    <div>
        <h2 class="dark:text-gray-500 text-lg font-semibold">Private</h2>
        <ul>
            @for (chat of privateChats; track $index) {
            <li class="cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 p-2 rounded transition-all ease-in-out duration-200 flex gap-4">
                <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-gray-400 text-gray-500 font-bold text-xs self-center">
                    {{ chat.name!.charAt(0).toUpperCase() }}
                </span>
                {{ chat.name }}
            </li>
            }
        </ul>
    </div>
</div>
